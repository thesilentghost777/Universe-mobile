name: universe_frontend
description: UniVerse — L'université en ligne (client Flutter)
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.6
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  shimmer: ^4.0.0
  cached_network_image: ^4.0.0
  url_launcher: ^6.3.1
  file_picker: ^13.1.0
  intl: ^0.20.2
  collection: ^1.19.1
  path_provider: ^2.1.5
  equatable: ^3.0.0
  image: ^4.3.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  # Uniquement pour le Mode Test (données fictives YouTube) — le backend
  # réel sert des flux Drive tickettés via /videos/:id/stream.
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# material_ui 1.3.0 annote des API avec @awaitNotRequired, exporté seulement
# depuis Flutter 3.47. On reste sur 3.44.8 / Dart 3.12.2.
dependency_overrides:
  material_ui: 1.2.0
  cupertino_ui: 1.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/campus/
